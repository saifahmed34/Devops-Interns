name: Compose validation

on:
  push:
  pull_request:

env:
  POSTGRES_PASSWORD: ci-local-only-change-me
  POSTGRES_USER: barq_app
  POSTGRES_DB: barq_tasks

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax checks
        run: python -m py_compile app/server.py validate.py failure_test.py scripts/analyze_logs.py

      - name: Compose configuration
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for service health
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            healthy=1
            for container in postgres redis app-01 app-02 nginx; do
              status=$(docker inspect --format '{{.State.Status}}|{{.State.Health.Status}}' "$container" 2>/dev/null || true)
              if [ "$status" != "running|healthy" ]; then
                healthy=0
              fi
            done
            if [ "$healthy" -eq 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps -a
            docker compose logs --no-color --tail=100
            exit 1
          fi

      - name: Run validation
        run: python validate.py

      - name: Cleanup
        if: always()
        run: docker compose down
